<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>

    <!--Connecting css file with html file-->
    <link rel="stylesheet" href="calculator.css">

    <!--Connecting js file with html file-->
    <!--defer: it specifies that the script is downloaded in parallel to parsing the page, and executed after the page has finished parsing -->
    <script src="calculator.js" defer></script>

</head>
<body>
   <div class="calculator">
       <div class="calculator-output" id="output"></div>
           <button class="calculator_operator" id="plus">+</button>
           <button class="calculator_operator" id="sub">-</button>
           <button class="calculator_operator" id="mul">*</button>
           <button class="calculator_operator" id="div">/</button>
           <button class="calculator_key" id="number7">7</button>
           <button class="calculator_key" id="number8">8</button>
           <button class="calculator_key" id="number9">9</button>
           <button class="calculator_key" id="number4">4</button>
           <button class="calculator_key" id="number5">5</button>
           <button class="calculator_key" id="number6">6</button>
           <button class="calculator_key" id="number1">1</button>
           <button class="calculator_key" id="number2">2</button>
           <button class="calculator_key" id="number3">3</button>
           <button class="calculator_key" id="number0">0</button>
           <button class="calculator_key" id="dot">.</button>
           <button class="calculator_key" id="ac">AC</button>
           <button class="calculator_key" id="del">DEL</button>
           <button class="calculator_operator_enter" id="equals">=</button>
   </div>

</body>
</html>
